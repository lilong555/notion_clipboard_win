name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows build and CTest
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure console build
        run: cmake -S . -B build-console -DNOTION_CLIPBOARD_WIN_GUI=OFF

      - name: Build console app
        run: cmake --build build-console --config Release

      - name: Run CTest suite
        run: ctest --test-dir build-console -C Release --output-on-failure

      - name: Check installer release guards
        shell: pwsh
        run: ./scripts/build-installer.ps1 -CheckOnly -AllowUnreleased -AllowExistingVersion

      - name: Run installer guard regression tests
        shell: pwsh
        run: ./scripts/test-build-installer.ps1
