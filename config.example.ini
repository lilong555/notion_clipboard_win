# 复制为 notion_clipboard_win.ini 后填写。
# 不要把真实 token 提交到仓库。

notion_token=

# 推荐填写 data_source_id。只有 database_id 时，程序会启动时自动解析第一个 data_source。
data_source_id=
database_id=

# 留空时自动从 data_source schema 中找 title 属性。
title_property_name=

# 可选：如果数据库里有 rich_text 属性，可把剪贴板内容前缀同步到该属性。
content_property_name=
content_property_max_chars=1800

# 如果存在这个名称的 date 属性，创建页面时自动写入任务创建时间。
# 如果该属性是 Notion 内置 created_time 类型，则 Notion 会自动填写，程序不会手动写。
created_time_property_name=创建时间

# 留空时默认使用 %LOCALAPPDATA%\NotionClipboardWin。
state_dir=

# 全局热键。支持 Ctrl/Shift/Alt/Win + 字母、数字、F1-F24 等。
hotkey=Ctrl+Shift+B

# 是否启用全局热键。默认按热键上传当前剪贴板。
enable_hotkey=true

# 是否复制文本后自动入队上传。默认关闭，避免所有复制都上传。
enable_clipboard_listener=false

# 是否显示托盘气泡通知。
tray_notifications=true

# 是否随当前 Windows 用户登录后自动启动后台托盘进程。
start_with_windows=false

# 剪贴板事件合并窗口，避免一次复制触发多次读取。
debounce_ms=750

# 同一段内容在该时间窗口内再次出现时忽略，用于抑制剪贴板重复通知。
duplicate_suppression_ms=3000

# 是否启动后立即上传当前剪贴板。
upload_initial_clipboard=false

# 单次剪贴板文本最大字节数，避免误复制超大内容造成内存和 API 峰值。
max_clipboard_bytes=262144

# Notion API 请求之间的最小间隔。Notion 通常不适合突发写入。
min_request_interval_ms=400

# 每批追加的 block 数量。调小可降低单请求峰值，调大可减少请求数。
append_batch_size=40

# 持久队列重试次数。超过后移动到 failed 目录，避免无限重试。
max_retry_attempts=12

# 单个 HTTP 操作内部的短重试次数；失败后仍会进入持久队列退避。
http_retry_attempts=3
